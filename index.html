<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Morning Pikachu</title>
<style>
:root{color-scheme:light dark;--bg:#fff4b8;--surface:#fffbea;--text:#3d2b16;--yellow:#ffd92f;--gold:#f3b91f;--red:#e7473c;--brown:#6b3e1e;--shadow:rgba(78,48,8,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}body{background:var(--bg)}
#app{min-height:100vh;background-color:var(--bg);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.8) 0 5%,transparent 6%),radial-gradient(circle at 80% 30%,rgba(255,255,255,.55) 0 4%,transparent 5%),linear-gradient(180deg,#ffe98a,#fff7cf 70%,#e8f7c9);color:var(--text);display:grid;place-items:center;overflow:hidden;position:relative;padding:28px}
.sun{position:absolute;width:170px;height:170px;border-radius:50%;background:#fff2a5;top:-45px;right:-25px;box-shadow:0 0 70px #fff0a0}
.cloud{position:absolute;width:120px;height:35px;background:#fff;opacity:.65;border-radius:30px;left:8%;top:18%;filter:blur(.2px);animation:drift 12s ease-in-out infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:55px;height:55px;left:20px;bottom:5px}.cloud:after{width:70px;height:70px;left:55px;bottom:0}.cloud.two{left:auto;right:12%;top:38%;transform:scale(.7);animation-delay:-5s}
.card{position:relative;width:min(780px,94vw);min-height:590px;border:3px solid rgba(255,255,255,.8);border-radius:38px;background:rgba(255,251,234,.72);backdrop-filter:blur(10px);box-shadow:0 25px 70px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 25px 32px;text-align:center;z-index:2}
h1{font-size:clamp(2.5rem,8vw,5.8rem);line-height:.95;margin:0;color:#5a3517;text-shadow:0 5px 0 #fff,0 8px 16px rgba(111,68,13,.12)}h1 span{color:#e49b00}.subtitle{font-size:clamp(1rem,2.5vw,1.35rem);margin:16px 0 0;opacity:.78}
.pika-wrap{height:300px;width:330px;position:relative;display:grid;place-items:center;margin-top:4px}.pika{position:relative;width:180px;height:180px;animation:jump 1.25s cubic-bezier(.2,.8,.3,1) infinite;filter:drop-shadow(0 18px 10px rgba(91,56,10,.16))}.ear{position:absolute;width:55px;height:105px;background:#ffd72e;border:4px solid var(--brown);border-radius:70% 40% 60% 40%;top:-48px;z-index:0}.ear:after{content:"";position:absolute;left:3px;top:-2px;width:45px;height:35px;background:#3e2717;border-radius:70% 35% 50% 40%}.ear.left{left:14px;transform:rotate(-24deg)}.ear.right{right:14px;transform:rotate(24deg)}.head{position:absolute;inset:10px 5px 0;border:4px solid var(--brown);background:#ffd72e;border-radius:48% 48% 45% 45%;z-index:1}.eye{position:absolute;width:20px;height:25px;background:#22150c;border-radius:50%;top:58px}.eye.left{left:40px}.eye.right{right:40px}.eye:after{content:"";position:absolute;width:7px;height:8px;border-radius:50%;background:white;top:3px;left:4px}.cheek{position:absolute;width:36px;height:32px;background:#f04436;border:3px solid #a62e25;border-radius:50%;top:91px}.cheek.left{left:18px}.cheek.right{right:18px}.nose{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:8px;height:7px;background:#5c3017;border-radius:50%}.mouth{position:absolute;left:50%;top:98px;transform:translateX(-50%);width:48px;height:30px;border-bottom:4px solid #5c3017;border-radius:0 0 50% 50%}.arm{position:absolute;width:55px;height:25px;background:#ffd72e;border:4px solid var(--brown);border-radius:50%;top:102px;z-index:2}.arm.left{left:-22px;transform:rotate(25deg)}.arm.right{right:-22px;transform:rotate(-25deg)}.foot{position:absolute;width:63px;height:34px;background:#ffd72e;border:4px solid var(--brown);border-radius:55% 45% 45% 55%;bottom:-12px;z-index:2}.foot.left{left:14px;transform:rotate(8deg)}.foot.right{right:14px;transform:rotate(-8deg)}.tail{position:absolute;width:48px;height:65px;background:#ffd72e;border:4px solid var(--brown);right:-37px;top:92px;z-index:-1;clip-path:polygon(0 0,100% 0,70% 35%,100% 50%,70% 100%,35% 72%,0 85%,20% 45%)}
.shadow{position:absolute;width:155px;height:22px;border-radius:50%;background:rgba(91,56,10,.17);bottom:14px;animation:shadow 1.25s cubic-bezier(.2,.8,.3,1) infinite}.btn{margin-top:10px;border:0;background:#f5b800;color:#3f270e;font-weight:800;font-size:1rem;padding:13px 22px;border-radius:999px;cursor:pointer;box-shadow:0 8px 18px rgba(176,119,0,.2);transition:.2s}.btn:hover{transform:translateY(-2px);background:#ffc91a}.spark{position:absolute;font-size:2rem;animation:twinkle 2s ease-in-out infinite}.s1{left:17%;bottom:22%}.s2{right:16%;top:21%;animation-delay:.6s}.s3{right:22%;bottom:18%;animation-delay:1.1s}
@keyframes jump{0%,100%{transform:translateY(12px) rotate(0)}45%{transform:translateY(-28px) rotate(-3deg)}60%{transform:translateY(-30px) rotate(3deg)}}@keyframes shadow{0%,100%{transform:scale(1);opacity:.35}45%{transform:scale(.65);opacity:.15}}@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0);opacity:.45}50%{transform:scale(1.15) rotate(12deg);opacity:1}}@keyframes drift{50%{transform:translateX(35px)}}
@media(max-width:500px){.card{min-height:560px;border-radius:28px}.pika-wrap{transform:scale(.88);margin:-4px 0}.subtitle{margin-top:2px}.s1{left:5%}.s2{right:5%}}
</style>
</head>
<body>
<main id="app">
<div class="sun"></div><div class="cloud"></div><div class="cloud two"></div>
<div class="spark s1">✦</div><div class="spark s2">✧</div><div class="spark s3">✦</div>
<section class="card">
<div class="pika-wrap"><div class="shadow"></div><div class="pika" aria-label="Pikachu jumping">
<div class="ear left"></div><div class="ear right"></div><div class="tail"></div><div class="head"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div><div class="cheek left"></div><div class="cheek right"></div><div class="arm left"></div><div class="arm right"></div><div class="foot left"></div><div class="foot right"></div>
</div></div>
<h1>Good Morning, <span>Pikachu!</span> ☀️</h1>
<p class="subtitle" id="message">Wishing you a bright, happy and electric day! ⚡</p>
<button class="btn" id="btn">Give Pikachu a boost ⚡</button>
</section>
<script>
const messages=["Wishing you a bright, happy and electric day! ⚡","Rise, shine, and catch all the happy moments! 🌞","Today is going to be super effective! 💛","Sending you a little morning spark! ✨"];
let i=0;document.getElementById('btn').addEventListener('click',()=>{i=(i+1)%messages.length;document.getElementById('message').textContent=messages[i];document.querySelector('.pika').animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-45px) scale(1.05)'},{transform:'translateY(0) scale(1)'}],{duration:650,easing:'cubic-bezier(.2,.8,.3,1)'});});
</script>
</main></body></html>
